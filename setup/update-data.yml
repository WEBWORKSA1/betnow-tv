name: Build, auto-update & deploy BetNow.tv
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # refresh fixtures, predictions & news every 6 hours
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live data & compute predictions
        run: python scripts/update_data.py
      - name: Build all pages + sitemap
        run: python scripts/build.py
      - name: Commit generated site to main
        run: |
          git config user.name "betnow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Auto-build & data refresh $(date -u +'%Y-%m-%d %H:%M') UTC" && git push)
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
